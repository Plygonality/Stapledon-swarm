name: calc

# Calc tests only. No Blend-ci, no Blender, no PNG hash, no stills fetch.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calc:
    name: calc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Calc tests
        run: pytest -q
